name: Apply Daily Tasks v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Habit Flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          root=Path('.')

          # index.html: state + local daily-task behavior + modal.
          p=root/'index.html'; s=p.read_text(encoding='utf-8')
          if 'dailyTasks:[]' not in s:
              s=s.replace('habits:[],tasks:[],moods:','habits:[],tasks:[],dailyTasks:[],moods:',1)
          if 'if(!Array.isArray(s.dailyTasks))s.dailyTasks=[];' not in s:
              s=s.replace("s.habits.forEach(h=>{if(!h.frequency)h.frequency='daily';if(!h.completions)h.completions={};});", "s.habits.forEach(h=>{if(!h.frequency)h.frequency='daily';if(!h.completions)h.completions={};});\n  if(!Array.isArray(s.dailyTasks))s.dailyTasks=[];\n  s.dailyTasks.forEach(t=>{if(!t.completions)t.completions={};if(t.active===undefined)t.active=true;});",1)
          s=s.replace('s.v=2;return s;','s.v=3;return s;',1)
          if 'function todaysDailyTasks()' not in s:
              core='''\nfunction todaysDailyTasks(){return (state.dailyTasks||[]).filter(t=>t.active!==false&&todayKey()>=localKey(new Date(t.createdAt)));}\nfunction dailyTaskDone(task,k=todayKey()){return task?.completions?.[k]===true;}\nfunction dailyTaskStats(k){const tasks=(state.dailyTasks||[]).filter(t=>t.active!==false&&k>=localKey(new Date(t.createdAt)));const done=tasks.filter(t=>dailyTaskDone(t,k)).length;return{d:done,t:tasks.length,p:tasks.length?Math.round(done/tasks.length*100):null};}\nasync function toggleDailyTask(id,k=todayKey()){const task=(state.dailyTasks||[]).find(t=>t.id===id);if(!task||task.active===false)return;task.completions=task.completions||{};const prev=task.completions[k]===true;task.completions[k]=!prev;save();render();const ok=await saveDailyTaskCompletionToCloud(task.id,k,!prev);if(!ok){task.completions[k]=prev;save();render();toast('Could not sync — change reverted');}}\nasync function submitDailyTask(){const input=document.getElementById('dtTitle'),title=input?.value.trim();if(!title)return;const task={id:(crypto.randomUUID?crypto.randomUUID():uid()),title,active:true,createdAt:new Date().toISOString(),completions:{}};state.dailyTasks.push(task);save();closeModal();render();const ok=await saveDailyTaskToCloud(task);if(!ok){state.dailyTasks=state.dailyTasks.filter(x=>x!==task);save();render();}}\nasync function delDailyTask(id){const task=(state.dailyTasks||[]).find(t=>t.id===id);if(!task)return;if(!confirm(`Delete daily task "${task.title}"?`))return;state.dailyTasks=state.dailyTasks.filter(t=>t.id!==id);save();render();const ok=await deleteDailyTaskFromCloud(id);if(!ok)toast('Could not delete daily task from cloud');}\n'''
              s=s.replace("  return tracked?Math.round(done/tracked*100):0;\n}\n", "  return tracked?Math.round(done/tracked*100):0;\n}\n"+core,1)
          s=s.replace("['habit','schedule'].map", "['habit','schedule','dailyTask'].map",1)
          s=s.replace("${{habit:'Habit',schedule:'Schedule'}[t]}","${{habit:'Habit',schedule:'Schedule',dailyTask:'Daily Task'}[t]}",1)
          if "else if(t==='dailyTask')" not in s:
              form='''  else if(t==='dailyTask'){area.innerHTML=`<h2>New daily task</h2><div class="field"><label>Task</label><input id="dtTitle" placeholder="e.g. Drink 2L of water"></div><p class="meta">This task appears every day and contributes to your daily and weekly completion.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitDailyTask()">Add daily task</button></div>`;}\n'''
              s=s.replace("  if(t==='schedule'){area.innerHTML=schedForm();durHint();}\n", "  if(t==='schedule'){area.innerHTML=schedForm();durHint();}\n"+form,1)
          p.write_text(s,encoding='utf-8')

          # views.js: daily task UI and progress calculations.
          p=root/'views.js'; s=p.read_text(encoding='utf-8')
          old="function dayPct(k){let d=0,t=0;state.habits.forEach(h=>{const f=parseHabitFrequency(h.frequency);if(f.type==='times_per_week'||f.type==='times_per_month')return;const s=cellState(h,k);if(s==='done'){d++;t++;}else if(s==='missed'||s==='today'){t++;}});return{d,t,p:t?Math.round(d/t*100):null};}"
          new="function dayPct(k){let d=0,t=0;state.habits.forEach(h=>{const f=parseHabitFrequency(h.frequency);if(f.type==='times_per_week'||f.type==='times_per_month')return;const s=cellState(h,k);if(s==='done'){d++;t++;}else if(s==='missed'||s==='today'){t++;}});const dt=dailyTaskStats(k);d+=dt.d;t+=dt.t;return{d,t,p:t?Math.round(d/t*100):null};}"
          s=s.replace(old,new,1)
          if 'function dailyTaskRow(t)' not in s:
              block='''\nfunction dailyTaskRow(t){const done=dailyTaskDone(t);return `<div class="hrow"><button class="hcheck ${done?'done':''}" aria-pressed="${done}" aria-label="${done?'Mark '+esc(t.title)+' not done':'Mark '+esc(t.title)+' done'}" onclick="toggleDailyTask('${t.id}')">${done?'✓':''}</button><button class="hmain" onclick="toggleDailyTask('${t.id}')"><span class="hicon">✓</span><span class="hname ${done?'strike':''}">${esc(t.title)}<small>Daily task</small></span></button><button class="rowdel" aria-label="Delete ${esc(t.title)}" title="Delete daily task" onclick="delDailyTask('${t.id}')">🗑</button></div>`;}\nfunction dailyWeekStats(k=todayKey()){const keys=weekKeys(k);let d=0,t=0;keys.filter(x=>x<=todayKey()).forEach(x=>{const a=dailyTaskStats(x);d+=a.d;t+=a.t;});return{d,t,p:t?Math.round(d/t*100):0};}\n\n'''
              s=s.replace('/* ---- TODAY ---- */',block+'/* ---- TODAY ---- */',1)
          old="function renderToday(){\n  const t=todayKey(),H=state.habits,sx=schedProgress(),doneH=H.filter(h=>h.completions[t]==='done').length,total=H.length+sx.t,done=doneH+sx.d,pct=total?Math.round(done/total*100):0;"
          new="function renderToday(){\n  const t=todayKey(),H=state.habits,sx=schedProgress(),doneH=H.filter(h=>h.completions[t]==='done').length;\n  const dt=dailyTaskStats(t),total=H.length+dt.t+sx.t,done=doneH+dt.d+sx.d,pct=total?Math.round(done/total*100):0;"
          s=s.replace(old,new,1)
          s=s.replace("  const items=itemsFor(t).sort((a,b)=>slot(a,t).s-slot(b,t).s),n=now(),best=Math.max(0,...H.map(streakFor));\n","  const items=itemsFor(t).sort((a,b)=>slot(a,t).s-slot(b,t).s),n=now(),best=Math.max(0,...H.map(streakFor));\n  const dailyTasks=todaysDailyTasks();\n",1)
          old='''  html+=`<div class="cols"><div><div class="section-title">Today's habits</div>${H.length?`<div class="card list">${H.map(h=>habitRow(h,true)).join('')}</div>`:empty('No habits yet.')}</div><div><div class="section-title">Today's schedule</div>${items.length?`<div class="card list">${items.slice(0,8).map(it=>{const s=getScheduleStatus(it,t,n);return `<div class="srow"><span class="stime">${fmtT(slot(it,t).s)}</span><span class="hname">${esc(it.title)}</span><span class="tag t-${s}">${STL[s]||s}</span></div>`;}).join('')}<button class="link" onclick="page='schedule';render()">Open schedule →</button></div>`:empty('Plan your day.',`<button class="btn" onclick="openModal('schedule')">+ Add Schedule</button>`)}</div></div>`;'''
          new='''  html+=`<div class="cols"><div><div class="section-title">Today's habits</div>${H.length?`<div class="card list">${H.map(h=>habitRow(h,true)).join('')}</div>`:empty('No habits yet.')}</div><div><div class="section-title">Daily tasks</div>${dailyTasks.length?`<div class="card list">${dailyTasks.map(dailyTaskRow).join('')}</div>`:empty('Add small tasks you want to complete every day.',`<button class="btn" onclick="openModal('dailyTask')">+ Add Daily Task</button>`)}</div></div>`;\n  html+=`<div><div class="section-title">Today's schedule</div>${items.length?`<div class="card list">${items.slice(0,8).map(it=>{const s=getScheduleStatus(it,t,n);return `<div class="srow"><span class="stime">${fmtT(slot(it,t).s)}</span><span class="hname">${esc(it.title)}</span><span class="tag t-${s}">${STL[s]||s}</span></div>`;}).join('')}<button class="link" onclick="page='schedule';render()">Open schedule →</button></div>`:empty('Plan your day.',`<button class="btn" onclick="openModal('schedule')">+ Add Schedule</button>`)}</div>`;'''
          s=s.replace(old,new,1)
          s=s.replace("function monthSummary(H,ks){let done=0,total=0;H.forEach(h=>{const s=habitMonthStats(h,ks);done+=Math.min(s.d,s.t);total+=s.t;});return{done,total,p:total?Math.round(done/total*100):0};}","function monthSummary(H,ks){let done=0,total=0;H.forEach(h=>{const s=habitMonthStats(h,ks);done+=Math.min(s.d,s.t);total+=s.t;});ks.forEach(k=>{const s=dailyTaskStats(k);done+=s.d;total+=s.t;});return{done,total,p:total?Math.round(done/total*100):0};}",1)
          old="const n=now(),y=n.getFullYear(),m=n.getMonth(),mk=monthKeys(y,m).filter(k=>k<=todayKey());let d=0,t=0;H.forEach(h=>{const s=statsFor(h,mk);d+=s.d;t+=s.t;});const mp=t?Math.round(d/t*100):0;"
          new="const n=now(),y=n.getFullYear(),m=n.getMonth(),mk=monthKeys(y,m).filter(k=>k<=todayKey());let d=0,t=0;H.forEach(h=>{const s=statsFor(h,mk);d+=s.d;t+=s.t;});mk.forEach(k=>{const a=dailyTaskStats(k);d+=a.d;t+=a.t;});const mp=t?Math.round(d/t*100):0;const ws=dailyWeekStats(todayKey());let weekD=ws.d,weekT=ws.t;const wk=weekKeys(todayKey()).filter(k=>k<=todayKey());H.forEach(h=>{const a=statsFor(h,wk);weekD+=a.d;weekT+=a.t;});const wp=weekT?Math.round(weekD/weekT*100):0;"
          s=s.replace(old,new,1)
          # Add a weekly progress ring before the existing monthly ring.
          frag='<div class="card hero"><div class="today-ring">${ring(mp,132,\'this month\')}'
          if frag in s and '${ring(wp,132,\'this week\')}' not in s:
              s=s.replace(frag,'<div class="cols"><div class="card hero"><div class="today-ring">${ring(wp,132,\'this week\')}</div><div class="hero-t"><b>${weekD} / ${weekT}</b> completed this week</div></div><div class="card hero"><div class="today-ring">${ring(mp,132,\'this month\')}',1)
          p.write_text(s,encoding='utf-8')

          # cloud-sync.js: Supabase CRUD + load.
          p=root/'cloud-sync.js'; s=p.read_text(encoding='utf-8')
          marker='// ===============================\n// SCHEDULE CLOUD SYNC\n// ==============================='
          daily='''// ===============================\n// DAILY TASK CLOUD SYNC\n// ===============================\nasync function saveDailyTaskToCloud(task){let user=await getCurrentUser();if(!user){const r=await supabaseClient.auth.getSession();user=r?.data?.session?.user||null;}if(!user){if(typeof toast==='function')toast('Not signed in. Please sign in again.');return false;}if(!task.id||!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(task.id))task.id=crypto.randomUUID?crypto.randomUUID():task.id;const {error}=await supabaseClient.from('daily_tasks').insert({id:task.id,user_id:user.id,title:task.title,active:task.active!==false,created_at:task.createdAt||new Date().toISOString()});if(error){console.error('Could not save daily task:',error);const detail=[error.code,error.message,error.details,error.hint].filter(Boolean).join(' | ');if(typeof toast==='function')toast('Daily Task save failed: '+(detail||'Unknown Supabase error'));return false;}return true;}\nasync function saveDailyTaskCompletionToCloud(taskId,date,completed){const user=await getCurrentUser();if(!user)return false;const {error}=await supabaseClient.from('daily_task_completions').upsert({user_id:user.id,daily_task_id:taskId,completion_date:date,completed:!!completed,completed_at:completed?new Date().toISOString():null},{onConflict:'daily_task_id,completion_date'});if(error){console.error('Could not save daily task completion:',error);return false;}return true;}\nasync function loadDailyTasksFromCloud(){const user=await getCurrentUser();if(!user)return;const {data:tasks,error:taskError}=await supabaseClient.from('daily_tasks').select('*').eq('user_id',user.id).order('created_at',{ascending:true});if(taskError){console.error('Could not load daily tasks:',taskError);return;}const {data:completions,error:compError}=await supabaseClient.from('daily_task_completions').select('*').eq('user_id',user.id);if(compError){console.error('Could not load daily task completions:',compError);return;}const byId=new Map();for(const c of completions||[]){if(!byId.has(c.daily_task_id))byId.set(c.daily_task_id,{});byId.get(c.daily_task_id)[c.completion_date]=!!c.completed;}state.dailyTasks=(tasks||[]).map(t=>({id:t.id,title:t.title,active:t.active!==false,createdAt:t.created_at,completions:byId.get(t.id)||{}}));}\nasync function deleteDailyTaskFromCloud(taskId){const user=await getCurrentUser();if(!user)return false;const {error}=await supabaseClient.from('daily_tasks').delete().eq('id',taskId).eq('user_id',user.id);if(error){console.error('Could not delete daily task:',error);return false;}return true;}\n\n'''
          if 'async function saveDailyTaskToCloud' not in s:s=s.replace(marker,daily+marker,1)
          else:
              a=s.index('async function saveDailyTaskToCloud'); b=s.index(marker,a); s=s[:a]+daily+s[b:]
          if 'await loadDailyTasksFromCloud();' not in s:s=s.replace('      await loadTasksFromCloud();\n','      await loadTasksFromCloud();\n      await loadDailyTasksFromCloud();\n',1)
          p.write_text(s,encoding='utf-8')

          mig=root/'supabase/migrations/20261028_daily_tasks.sql'; mig.parent.mkdir(parents=True,exist_ok=True)
          mig.write_text('''-- Habit Flow 1.1.0: Daily Tasks\ncreate table if not exists public.daily_tasks (id uuid primary key default gen_random_uuid(),user_id uuid references auth.users(id) on delete cascade,title text not null,active boolean not null default true,created_at timestamptz not null default now());\nalter table public.daily_tasks add column if not exists user_id uuid;\nalter table public.daily_tasks add column if not exists title text;\nalter table public.daily_tasks add column if not exists active boolean not null default true;\nalter table public.daily_tasks add column if not exists created_at timestamptz not null default now();\ncreate table if not exists public.daily_task_completions (id uuid primary key default gen_random_uuid(),user_id uuid references auth.users(id) on delete cascade,daily_task_id uuid not null references public.daily_tasks(id) on delete cascade,completion_date date not null,completed boolean not null default false,completed_at timestamptz,unique(daily_task_id,completion_date));\nalter table public.daily_task_completions add column if not exists user_id uuid;\nalter table public.daily_task_completions add column if not exists daily_task_id uuid;\nalter table public.daily_task_completions add column if not exists completion_date date;\nalter table public.daily_task_completions add column if not exists completed boolean not null default false;\nalter table public.daily_task_completions add column if not exists completed_at timestamptz;\ncreate index if not exists daily_tasks_user_id_idx on public.daily_tasks(user_id);\ncreate index if not exists daily_task_completions_user_id_idx on public.daily_task_completions(user_id);\ncreate index if not exists daily_task_completions_task_date_idx on public.daily_task_completions(daily_task_id,completion_date);\nalter table public.daily_tasks enable row level security; alter table public.daily_task_completions enable row level security;\ndrop policy if exists "Users can manage their daily tasks" on public.daily_tasks; create policy "Users can manage their daily tasks" on public.daily_tasks for all using(auth.uid()=user_id) with check(auth.uid()=user_id);\ndrop policy if exists "Users can manage their daily task completions" on public.daily_task_completions; create policy "Users can manage their daily task completions" on public.daily_task_completions for all using(auth.uid()=user_id) with check(auth.uid()=user_id);\ngrant select,insert,update,delete on public.daily_tasks to authenticated; grant select,insert,update,delete on public.daily_task_completions to authenticated; notify pgrst,'reload schema';\n''',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html views.js cloud-sync.js supabase/migrations/20261028_daily_tasks.sql
          git diff --cached --quiet || (git commit -m "Add working Daily Tasks feature [skip ci]" && git push)
