name: Fix Daily Tasks workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix invalid workflow expression
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-daily-tasks-v2.yml')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          changed = False
          for i, line in enumerate(lines):
              if 's=s.replace(' in line and 'habit:' in line and 'dailyTask:' in line:
                  indent = line[:len(line)-len(line.lstrip())]
                  lines[i] = indent + "s=s.replace(chr(36)+\"{{habit:'Habit',schedule:'Schedule'}[t]}\",chr(36)+\"{{habit:'Habit',schedule:'Schedule',dailyTask:'Daily Task'}[t]}\",1)\n"
                  changed = True
                  break
          if not changed:
              raise SystemExit('The invalid Daily Tasks expression line was not found.')
          p.write_text(''.join(lines), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-daily-tasks-v2.yml
          git commit -m 'Fix Daily Tasks workflow syntax'
          git push
