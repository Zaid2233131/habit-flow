<script>
async function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const rawData = atob(base64);

  return Uint8Array.from(
    [...rawData].map(char => char.charCodeAt(0))
  );
}


async function registerPushNotifications() {

  try {

    if (!("serviceWorker" in navigator)) {
      console.warn("Service workers are not supported.");
      return false;
    }

    if (!("PushManager" in window)) {
      console.warn("Web Push is not supported.");
      return false;
    }

    if (!("Notification" in window)) {
      console.warn("Notifications are not supported.");
      return false;
    }


    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      console.warn("Notification permission denied.");
      return false;
    }


    const registration = await navigator.serviceWorker.ready;

    let subscription = await registration.pushManager.getSubscription();


    if (!subscription) {

      const applicationServerKey =
        await urlBase64ToUint8Array(VAPID_PUBLIC_KEY);

      subscription =
        await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey
        });

    }


    const user = await getCurrentUser();

    if (!user) {
      console.warn("No logged-in user. Push subscription not saved.");
      return false;
    }


    const json = subscription.toJSON();

    const endpoint = json.endpoint;
    const p256dh = json.keys?.p256dh;
    const auth = json.keys?.auth;


    if (!endpoint || !p256dh || !auth) {
      console.error("Invalid push subscription.");
      return false;
    }


    const { error } = await supabaseClient
      .from("push_subscriptions")
      .upsert(
        {
          user_id: user.id,
          endpoint,
          p256dh,
          auth,
          device_name: /iPhone|iPad|iPod/i.test(navigator.userAgent)
            ? "iPhone"
            : "Browser"
        },
        {
          onConflict: "user_id,endpoint"
        }
      );


    if (error) {
      console.error(
        "❌ Could not save push subscription:",
        error
      );

      return false;
    }


    console.log(
      "✅ Push subscription saved to Supabase"
    );

    return true;

  } catch (error) {

    console.error(
      "❌ Push registration failed:",
      error
    );

    return false;
  }
}
</script>

const KEY='habitflow-data-v2',OLD_KEY='habitflow-data-v1'; // v1 is left untouched as a backup
const CATS=['Health','Fitness','Study','Work','Personal','Other'];
function defaultState(){return{v:2,name:'there',theme:'system',habits:[],tasks:[],moods:{},schedules:[],notifications:[],reminderLogs:[],settings:{notificationsEnabled:false,mode:'alarm',sound:'default',taskRem:true,habitRem:true,routineRem:true,overdueRem:true,uncompletedHabitReminders:true,habitReminderMax:6,habitReminderStart:'09:00',habitReminderEnd:'22:00',habitReminderPlan:{date:null,slots:[],sent:[],lastHabitId:null},serverHabitRemindersReady:false,quiet:{enabled:false,start:'23:00',end:'06:00'},simOffset:0}};}
function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);return migrateV1ToV2(raw?JSON.parse(raw):{});}catch(e){return defaultState();}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
/* ===== v2: date/time utils (local timezone, never UTC) ===== */
const pad=n=>String(n).padStart(2,'0');
function localKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function now(){const o=(state&&state.settings&&state.settings.simOffset)||0;return new Date(Date.now()+o*60000);} // single clock; simulated-time aware
const minutesSinceMidnight=d=>d.getHours()*60+d.getMinutes();
const isToday=k=>k===localKey(now());
const getLocalDateKey=()=>localKey(now());
const getLocalTime=()=>pad(now().getHours())+':'+pad(now().getMinutes());
function parseHabitFrequency(raw){
  if(raw&&typeof raw==='object')return raw;
  if(!raw||raw==='daily')return{type:'daily'};
  try{const x=JSON.parse(raw);if(x&&x.type)return x;}catch(e){}
  if(typeof raw==='string'&&raw.startsWith('specific:'))return{type:'specific_days',days:raw.slice(9).split(',').map(Number).filter(Number.isFinite)};
  return{type:'daily'};
}
function habitWeekStartKey(k){const d=new Date(k+'T00:00:00');d.setDate(d.getDate()-d.getDay());return localKey(d);}
function habitWeekKeys(k){const d=new Date(habitWeekStartKey(k)+'T00:00:00');return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return localKey(x);});}
function habitDoneInKeys(h,keys){return keys.filter(k=>h.completions&&h.completions[k]==='done').length;}
function habitQuotaDone(h,k){const f=parseHabitFrequency(h.frequency);if(f.type==='times_per_week')return habitDoneInKeys(h,habitWeekKeys(k));if(f.type==='times_per_month'){const d=new Date(k+'T00:00:00');return habitDoneInKeys(h,[...Array(new Date(d.getFullYear(),d.getMonth()+1,0).getDate())].map((_,i)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(i+1)));}return 0;}
function habitDueOnDate(h,k){
  if(!h||k<localKey(new Date(h.createdAt)))return false;
  const f=parseHabitFrequency(h.frequency);
  if(f.type==='daily')return true;
  if(f.type==='specific_days')return (f.days||[]).includes(new Date(k+'T00:00:00').getDay());
  const q=Math.max(1,Number(f.count)||1);
  return habitQuotaDone(h,k)<q;
}

function migrateV1ToV2(o){
  const d=defaultState(),s=Object.assign(d,o||{});
  s.settings=Object.assign(d.settings,(o&&o.settings)||{});
  s.settings.quiet=Object.assign({enabled:false,start:'23:00',end:'06:00'},s.settings.quiet||{});
  s.settings.uncompletedHabitReminders = s.settings.uncompletedHabitReminders !== false;
  s.settings.habitReminderMax = Math.max(1,Math.min(10,Number(s.settings.habitReminderMax)||6));
  s.settings.habitReminderStart = s.settings.habitReminderStart || '09:00';
  s.settings.habitReminderEnd = s.settings.habitReminderEnd || '22:00';
  s.settings.habitReminderPlan = Object.assign({date:null,slots:[],sent:[],lastHabitId:null},s.settings.habitReminderPlan||{});
  s.settings.serverHabitRemindersReady = !!s.settings.serverHabitRemindersReady;
  ['schedules','notifications','reminderLogs'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(!Array.isArray(s.habits))s.habits=[];
  s.habits.forEach(h=>{if(!h.frequency)h.frequency='daily';if(!h.completions)h.completions={};});
  s.v=2;return s; // habits/tasks/moods pass through untouched
}

function streakFor(h){
  let cur=now(); let s=0;
  let k=localKey(cur);
  if(h.completions[k]!=='done'){cur.setDate(cur.getDate()-1);}
  while(true){
    k=localKey(cur);
    const st=h.completions[k];
    if(st==='done'){s++;cur.setDate(cur.getDate()-1);}
    else if(st==='skip'){cur.setDate(cur.getDate()-1);}
    else break;
  }
  return s;
}
function rate30(h){
  let done=0,tracked=0;
  const created=new Date(h.createdAt);
  for(let i=0;i<30;i++){
    const d=now(); d.setDate(d.getDate()-i);
    if(d<created) break;
    const k=localKey(d);
    const st=h.completions[k];
    if(st==='skip') continue;
    tracked++;
    if(st==='done') done++;
  }
  return tracked?Math.round(done/tracked*100):0;
}

/* ===== v2: schedule model + status engine ===== */
const TRACKED=['task','habit','routine'];
const DAYNAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const STL={upcoming:'Upcoming','starting-soon':'Starting soon',active:'Active',overdue:'Overdue',completed:'Completed',snoozed:'Snoozed',skipped:'Skipped',expired:'Passed'};
const TI={task:'✅',habit:'🔁',routine:'🌅',event:'📌',break:'☕'};

const toMin=t=>{const p=t.split(':');return +p[0]*60+ +p[1];};
const fmtT=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const fmtDur=m=>m<60?m+' min':Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'');
const atMs=(dk,m)=>new Date(dk+'T00:00:00').getTime()+m*60000;
const findItem=id=>state.schedules.find(x=>x.id===id);
function occurs(it,dk){
  if(it.repeat==='once')return it.date===dk;
  if(dk<it.date)return false;
  const w=new Date(dk+'T00:00:00').getDay();
  return it.repeat==='daily'||(it.repeat==='weekdays'&&w>0&&w<6)||(it.repeat==='weekends'&&(w===0||w===6))||(it.repeat==='custom'&&(it.days||[]).includes(w));
}
const itemsFor=dk=>state.schedules.filter(it=>occurs(it,dk));
const occR=(it,dk)=>(it.log&&it.log[dk])||{};                       // read-only per-day record
const occW=(it,dk)=>{it.log=it.log||{};return it.log[dk]=it.log[dk]||{};}; // create on write
function slot(it,dk){const o=occR(it,dk);return{s:toMin(o.ov?o.ov.start:it.start),e:toMin(o.ov?o.ov.end:it.end)};}
function linkedOf(it){return{h:it.habitId&&state.habits.find(x=>x.id===it.habitId),t:it.taskId&&state.tasks.find(x=>x.id===it.taskId)};}
/* SOURCE OF TRUTH for time logic: every screen + the reminder engine call this. */
function getScheduleStatus(it,dk,n){
  n=n||now();const o=occR(it,dk),L=linkedOf(it);
  if(o.status==='completed'||(L.h&&L.h.completions[dk]==='done')||(L.t&&L.t.completed))return'completed';
  if(o.status==='skipped'||(L.h&&L.h.completions[dk]==='skip'))return'skipped';
  const today=localKey(n);
  if(dk<today)return'expired';
  if(dk>today)return'upcoming';
  const m=minutesSinceMidnight(n),t=slot(it,dk);
  if(o.snoozeUntil&&n.getTime()<o.snoozeUntil)return'snoozed';
  if(m<t.s)return t.s-m<=(it.remindBefore||15)?'starting-soon':'upcoming';
  if(m<t.e)return'active';
  return TRACKED.includes(it.type)?'overdue':'expired'; // events/breaks just pass; only tasks/habits/routines go overdue
}

function resetRem(o){o.fired={};o.rc=0;o.last=0;} // cancels old reminders; engine re-derives new ones from state
function logAction(id,act){for(let i=state.reminderLogs.length-1;i>=0;i--){const l=state.reminderLogs[i];if(l.id===id&&!l.action){l.action=act;l.actAt=now().getTime();break;}}}
function schedAct(id,dk,act){
  const it=findItem(id);if(!it)return;

  if(act==='complete'){
    o.status='completed';o.completedAt=n.getTime();
    const ref=o.startedAt?Math.floor((o.startedAt-atMs(dk,0))/60000):m;
    o.delay=Math.max(0,ref-planned); // minutes later than planned start
    if(L.h){L.h.completions[dk]='done';const s=streakFor(L.h);if(s>(L.h.longest||0))L.h.longest=s;}
    if(L.t){L.t.completed=true;L.t.completedAt=dk;}

  }
  if(act==='skip'){o.status='skipped';if(L.h)L.h.completions[dk]='skip';}
  logAction(id, act);

let alarmAudioCtx = null;
let alarmOsc = null;
let alarmGain = null;
let alarmTimer = null;

function unlockAlarmAudio(){
  try{
    if(!alarmAudioCtx){
      alarmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(alarmAudioCtx.state === 'suspended'){
      alarmAudioCtx.resume();
    }
  }catch(e){}
}

document.addEventListener('pointerdown', unlockAlarmAudio, {once:false});
document.addEventListener('keydown', unlockAlarmAudio, {once:false});

function startAlarmSound(){

  const v = state.settings.sound;

  if(v === 'off') return;

  try{

    unlockAlarmAudio();

    if(!alarmAudioCtx) return;

    stopAlarmSound();

    alarmOsc = alarmAudioCtx.createOscillator();
    alarmGain = alarmAudioCtx.createGain();

    alarmOsc.frequency.value =
      v === 'strong' ? 880 :
      v === 'soft' ? 440 :
      660;

    alarmGain.gain.value =
      v === 'strong' ? 0.22 :
      v === 'soft' ? 0.08 :
      0.15;

    alarmOsc.connect(alarmGain);
    alarmGain.connect(alarmAudioCtx.destination);

    alarmOsc.start();

    // Pulse the alarm every 900ms
    let high = true;

    alarmTimer = setInterval(() => {

      if(!alarmGain || !alarmAudioCtx) return;

      high = !high;

      alarmGain.gain.setTargetAtTime(
        high ? 0.15 : 0.02,
        alarmAudioCtx.currentTime,
        0.04
      );

    }, 900);

  }catch(e){
    console.warn('Alarm audio blocked:', e);
  }
}

function stopAlarmSound(){

  if(alarmTimer){
    clearInterval(alarmTimer);
    alarmTimer = null;
  }

  try{
    if(alarmOsc){
      alarmOsc.stop();
      alarmOsc.disconnect();
    }
  }catch(e){}

  try{
    if(alarmGain){
      alarmGain.disconnect();
    }
  }catch(e){}

  alarmOsc = null;
  alarmGain = null;
}
let activeAlarmKey=null;
const alarmQueue=[];
function alarmKey(id,dk){return id+'@'+dk;}
function showAlarm(id,dk){
  const key=alarmKey(id,dk);
  if(activeAlarmKey===key)return;
  if(activeAlarmKey){if(!alarmQueue.some(x=>x.key===key))alarmQueue.push({id,dk,key});return;}
  const it=findItem(id);if(!it)return;
  activeAlarmKey=key;
  const t=slot(it,dk);

  <button class="delbtn" style="margin-top:10px" onclick="dismissAlarm('${id}','${dk}')">Dismiss</button></div>`);

const ReminderManager={
  timer:null,
  start(){if(this.timer)return;this.tick();this.timer=setInterval(()=>this.tick(),15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.tick();});}, // ONE interval only
  allowed(it,n){
    const S=state.settings;if(!S.notificationsEnabled||it.notify===false)return false;
    if(!S[{task:'taskRem',habit:'habitRem',routine:'routineRem'}[it.type]||'taskRem'])return false;
    const q=S.quiet;
    if(q.enabled&&it.priority!=='P1'){const m=minutesSinceMidnight(n),a=toMin(q.start),b=toMin(q.end);if(a>b?(m>=a||m<b):(m>=a&&m<b))return false;}
    return true;
  },
  fire(it,dk,type,msg){
    pushNote(msg,type);
    state.reminderLogs.push({id:it.id,item:it.title,at:now().getTime(),type,shown:true,action:null});
    if(state.reminderLogs.length>500)state.reminderLogs.splice(0,100);
    browserNotify(msg,it.id);
    if(state.settings.mode==='alarm'&&type==='start')showAlarm(it.id,dk);else toast(msg,6000);
  },
  /* Stateless: everything is derived from stored times + per-day counters saved in state,
     so a refresh / reopen rebuilds itself and never double-fires (Cases 6 & 7). */
  tick(){
    const S=state.settings;if(!S.notificationsEnabled)return;
    const n=now(),dk=localKey(n),nm=n.getTime(),m=minutesSinceMidnight(n);let dirty=false;
    itemsFor(dk).forEach(it=>{
      const st=getScheduleStatus(it,dk,n);
      if(['completed','skipped','snoozed','expired'].includes(st))return; // never notify after done/skip/snooze/day end
      if(!this.allowed(it,n))return;
      const o=occW(it,dk),t=slot(it,dk);o.fired=o.fired||{};
      if(it.remindBefore>0&&S.mode!=='gentle'&&!o.fired.pre&&m>=t.s-it.remindBefore&&m<t.s){o.fired.pre=1;o.last=nm;dirty=true;this.fire(it,dk,'pre',it.title+' starts in '+(t.s-m)+' min.');}
      if(m>=t.s&&!o.fired.start){
        o.fired.start=1;o.last=nm;dirty=true;
        this.fire(it,dk,'start',m-t.s>30?it.title+' was due at '+fmtT(t.s)+' and is still waiting.':"It's time for "+it.title+'.');
      }else if(o.fired.start&&it.monitor&&TRACKED.includes(it.type)&&S.overdueRem&&S.mode!=='gentle'){
        const cap=Math.min(S.mode==='normal'?1:(it.maxRem||20),20),gap=Math.max(it.interval||60,5)*60000; // hard ceiling of 20; min 5-minute gap
        if((o.rc||0)<cap&&nm-(o.last||0)>=gap){o.rc=(o.rc||0)+1;o.last=nm;dirty=true;this.fire(it,dk,'followup',st==='overdue'?it.title+' is still incomplete. Complete it now or reschedule?':"You haven't completed "+it.title+' yet.');}
      }
    });
    if(dirty){save();renderIfLive();}
  }
};
function renderIfLive(){if((page==='schedule'||page==='today')&&!document.getElementById('overlay').classList.contains('show')&&!document.hidden){const y=window.scrollY;render();window.scrollTo(0,y);}}
/* ===== Random uncompleted-habit reminders =====
   Generates a small daily set of randomized reminder times. Each due slot picks
   one habit that is still incomplete today, so completed/skipped habits leave the pool.
   This is intentionally client-side: browser push can wake the app only when backed by
   a server scheduler. While Habit Flow is open/alive, these reminders run automatically. */
const HabitReminderManager={
  timer:null,
  start(){if(state.settings.serverHabitRemindersReady)return;if(this.timer)return;this.ensurePlan();this.tick();this.timer=setInterval(()=>this.tick(),30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.tick();});},
  enabled(){const S=state.settings;return !!(S.notificationsEnabled&&S.uncompletedHabitReminders);},
  inQuiet(n){const q=state.settings.quiet;if(!q||!q.enabled)return false;const m=minutesSinceMidnight(n),a=toMin(q.start),b=toMin(q.end);return a>b?(m>=a||m<b):(m>=a&&m<b);},
  eligible(){const k=todayKey();return state.habits.filter(h=>habitDueOnDate(h,k)&&h.completions[k]!=='done'&&h.completions[k]!=='skip');},
  randomSlots(dateKey){
    const S=state.settings,n=Math.max(1,Math.min(10,Number(S.habitReminderMax)||6));
    let start=toMin(S.habitReminderStart||'09:00'),end=toMin(S.habitReminderEnd||'22:00');
    if(end<=start)end=23*60;
    const span=end-start;if(span<30)return[];
    const count=Math.min(n,Math.max(1,Math.floor(span/60)));
    const minGap=Math.max(45,Math.floor(span/(count+1)));
    const slots=[];
    for(let i=0;i<count;i++){
      const lo=start+i*minGap+10,hi=Math.min(end-10,start+(i+1)*minGap-10);
      const m=hi>lo?lo+Math.floor(Math.random()*(hi-lo+1)):Math.min(end-1,lo);
      slots.push(new Date(dateKey+'T00:00:00').getTime()+m*60000);
    }
    return slots.sort((a,b)=>a-b);
  },
  ensurePlan(){
    const S=state.settings,k=todayKey(),p=S.habitReminderPlan||{};
    if(p.date===k&&Array.isArray(p.slots)&&Array.isArray(p.sent))return;
    S.habitReminderPlan={date:k,slots:this.randomSlots(k),sent:[],lastHabitId:null};
    // Keep the generated plan deterministic for the rest of the day.
    save();
  },
  chooseHabit(list){
    const last=state.settings.habitReminderPlan.lastHabitId;
    const pool=list.length>1?list.filter(h=>h.id!==last):list;
    return (pool.length?pool:list)[Math.floor(Math.random()*(pool.length?pool:list).length)];
  },
  fire(h){
    const msg='You haven\'t completed “'+h.name+'” yet. Take a moment to do it now.';
    pushNote(msg,'habit-followup');
    browserNotify(msg,'habit-'+h.id+'-'+todayKey());
    toast('Habit reminder: '+h.name,6000);
    state.settings.habitReminderPlan.lastHabitId=h.id;
  },
  tick(){
    if(!this.enabled())return;
    this.ensurePlan();
    const n=now(),nm=n.getTime(),p=state.settings.habitReminderPlan;
    if(this.inQuiet(n))return;
    const list=this.eligible();
    if(!list.length)return;
    const due=[];
    p.slots.forEach((ts,i)=>{if(ts<=nm&&!p.sent.includes(i))due.push(i);});
    if(!due.length)return;
    // If the app was backgrounded, consume all overdue slots but send only one catch-up notification.
    const idx=due[due.length-1];
    due.forEach(i=>{if(i!==idx)p.sent.push(i);});
    if(p.sent.includes(idx))return;
    const h=this.chooseHabit(list);if(!h){p.sent.push(idx);save();return;}
    p.sent.push(idx);this.fire(h);save();
  }
};
async function askPerm(){if(!('Notification' in window)){toast('Notifications unsupported here — in-app alerts only.');return false;}if(Notification.permission==='default'){const p=await Notification.requestPermission();if(p!=='granted'){render();return false;}}let pushOk=false;try{pushOk=await registerPushNotifications();}catch(e){console.warn('Push registration unavailable:',e);}render();return pushOk;}
async function setS(k,v){state.settings[k]=v;if(k==='habitReminderMax')state.settings.habitReminderMax=Math.max(1,Math.min(10,Number(v)||6));if(['habitReminderMax','habitReminderStart','habitReminderEnd'].includes(k))state.settings.habitReminderPlan={date:null,slots:[],sent:[],lastHabitId:null};save();if((k==='notificationsEnabled'&&v)||(k==='uncompletedHabitReminders'&&v)){await askPerm();}if(typeof syncHabitReminderSettingsToCloud==='function'){await syncHabitReminderSettingsToCloud();}render();ReminderManager.tick();if(!state.settings.serverHabitRemindersReady)HabitReminderManager.tick();}
function setQ(k,v){state.settings.quiet[k]=v;save();}
function setSim(){const v=document.getElementById('simT').value;if(!v)return;const r=new Date();state.settings.simOffset=toMin(v)-minutesSinceMidnight(r);save();ReminderManager.tick();render();}

function openResched(id,dk){const it=findItem(id),t=slot(it,dk);modal(`<h2>Reschedule (today)</h2><div class="two"><div class="field"><label>Start</label><input type="time" id="rStart" value="${fmtT(t.s)}"></div><div class="field"><label>End</label><input type="time" id="rEnd" value="${fmtT(t.e)}"></div></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="doResched('${id}','${dk}')">Save</button></div>`);}
function itemBtns(it,dk,st){
  if(!TRACKED.includes(it.type)||['completed','skipped','expired'].includes(st))return'';
  const b=(l,js,p)=>`<button class="btn ${p?'':'ghost'} sm" onclick="${js}">${l}</button>`,a=x=>`schedAct('${it.id}','${dk}','${x}')`,o=occR(it,dk);
  if(st==='overdue')return b('Complete now',a('complete'),1)+b('Snooze',`openSnooze('${it.id}','${dk}')`)+b('Reschedule',`openResched('${it.id}','${dk}')`)+b('Skip',a('skip'));
  if(st==='active')return(o.startedAt?'':b('Start',a('start')))+b('Complete',a('complete'),1)+b('Snooze',`openSnooze('${it.id}','${dk}')`)+b('Skip',a('skip'));
  return b('Complete',a('complete'),1)+b('Reschedule',`openResched('${it.id}','${dk}')`)+b('Skip',a('skip'));
}
function schedCard(it,dk,n){
  const st=getScheduleStatus(it,dk,n),t=slot(it,dk),o=occR(it,dk),m=minutesSinceMidnight(n);
  const extra=st==='overdue'?` · overdue by ${fmtDur(m-t.e)}`:o.ov?' · rescheduled':'';
  return`<div class="sitem st-${st}"><div class="rowflex"><div class="itname">${TI[it.type]} ${esc(it.title)}</div><span class="tag t-${st}">${STL[st]}</span></div>
  <div class="meta">${fmtT(t.s)}–${fmtT(t.e)} · ${it.type} · ${it.priority}${extra}</div>
  <div class="sact">${itemBtns(it,dk,st)}<button class="delbtn" style="margin-left:auto" aria-label="Delete" onclick="delSched('${it.id}')">×</button></div></div>`;
}
function focusHtml(quick){ // NOW → NEXT → OVERDUE
  const n=now(),dk=localKey(n),m=minutesSinceMidnight(n);
  const L=itemsFor(dk).map(it=>({it,st:getScheduleStatus(it,dk,n),t:slot(it,dk)})).sort((a,b)=>a.t.s-b.t.s);
  const act=L.filter(x=>x.st==='active'),nx=L.find(x=>['upcoming','starting-soon','snoozed'].includes(x.st)),od=L.filter(x=>x.st==='overdue');
  let h='';
  if(act.length)h+=`<div class="section-title">Right now</div>`+act.map(x=>schedCard(x.it,dk,n)).join('');
  if(nx)h+=`<div class="section-title">Next up · starts in ${fmtDur(Math.max(nx.t.s-m,0))}${nx.t.s-m<=15?' — prepare now':''}</div>`+schedCard(nx.it,dk,n)+(quick?`<div class="sact" style="margin:-4px 0 14px"><button class="btn ghost sm" onclick="startNext()">▶ Start next</button><button class="btn ghost sm" onclick="snoozeNext()">⏱ Snooze next 15m</button></div>`:'');
  if(od.length)h+=`<div class="section-title">You're behind schedule</div>`+od.map(x=>schedCard(x.it,dk,n)).join('');
  return h;
}
const schedSummary=()=>state.schedules.length?focusHtml(true):'';
function schedProgress(){const n=now(),dk=localKey(n);let t=0,d=0;itemsFor(dk).forEach(it=>{if(!TRACKED.includes(it.type)||it.habitId||it.taskId)return;t++;if(getScheduleStatus(it,dk,n)==='completed')d++;});return{t,d};} // linked items are already counted via their habit/task → no double count
const nowLine=m=>`<div class="nowline" id="nowline">🔴 NOW ${fmtT(m)}</div>`;
function renderSchedule(){
  const n=now(),
        today=localKey(n),
        dk=schedDate||today,
        m=minutesSinceMidnight(n);

  // Build the week around the currently selected date
  const baseDate=new Date(dk+'T00:00:00');

  const mon=new Date(baseDate);
  mon.setDate(mon.getDate()-((mon.getDay()+6)%7));

  const tabs=[...Array(7)].map((_,i)=>{
    const d=new Date(mon);
    d.setDate(mon.getDate()+i);

    const k=localKey(d);

    return `<button
      class="${k===dk?'on':''}"
      onclick="schedDate='${k}';schedScrolled=false;render()"
    >${DAYNAMES[d.getDay()]}<br>${d.getDate()}</button>`;
  }).join('');

  // Previous and next week
  const prevWeek=new Date(mon);
  prevWeek.setDate(prevWeek.getDate()-7);

  const nextWeek=new Date(mon);
  nextWeek.setDate(nextWeek.getDate()+7);

  const weekNav=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <button
        class="btn ghost sm"
        onclick="schedDate='${localKey(prevWeek)}';schedScrolled=false;render()"
      >
        ← Previous
      </button>

      <div class="meta">
        ${fmtLong(localKey(mon))}
      </div>

      <button
        class="btn ghost sm"
        onclick="schedDate='${localKey(nextWeek)}';schedScrolled=false;render()"
      >
        Next →
      </button>
    </div>
  `;

  const L=itemsFor(dk).sort(
    (a,b)=>slot(a,dk).s-slot(b,dk).s
  );

  const alarmReady=state.settings.notificationsEnabled&&state.settings.mode==='alarm'&&state.settings.sound!=='off';

  let h=`
    <div class="topbar">
      <div>
        <h1>Schedule</h1>
        <p class="sub">${fmtLong(dk)}</p>
      </div>

      <div style="display:flex;gap:8px">
        ${bellBtn()}
        <button class="btn" onclick="openModal('schedule')">+ Add</button>
      </div>
    </div>

    ${weekNav}

    <div class="tabs">${tabs}</div>
    <div class="alarm-banner ${alarmReady?'ready':''}">
      <div class="alarm-banner-icon">⏰</div>
      <div class="alarm-banner-copy"><b>${alarmReady?'Schedule alarms are ON':'Turn on schedule alarms'}</b><span>${alarmReady?'Popup + sound will appear when a scheduled item reaches its time.':'Get an alarm popup with sound, Snooze and Dismiss actions while Habit Flow is open.'}</span></div>
      ${alarmReady?'<span class="alarm-status">ON</span>':`<button class="btn sm" onclick="enableScheduleAlarm()">Enable alarms</button>`}
    </div>
  `;

  if(dk===today)h+=focusHtml(false);

  if(!L.length){
    return h+`
      <div class="card empty">
        <p>Nothing scheduled for this day.</p>
        <button class="btn" onclick="openModal('schedule')">
          Add to schedule
        </button>
      </div>
    `;
  }

  let rows='',
      placed=dk!==today;

  L.forEach(it=>{
    const t=slot(it,dk);

    if(!placed&&t.s>m){
      rows+=nowLine(m);
      placed=true;
    }

    rows+=`
      <div class="trow">
        <div class="ttime">${fmtT(t.s)}</div>
        <div>${schedCard(it,dk,n)}</div>
      </div>
    `;
  });

  if(!placed)rows+=nowLine(m);

  return h+`
    <div class="section-title">Timeline</div>
    ${rows}
  `;
}
function positionHabitGrid(){
  const wrap=document.getElementById('habitGridScroll');
  if(!wrap)return;
  const c=curMonth(),n=now(),currentMonth=c.y===n.getFullYear()&&c.m===n.getMonth();
  const targetKey=currentMonth?todayKey():(c.y<n.getFullYear()||c.y===n.getFullYear()&&c.m<n.getMonth()?monthKeys(c.y,c.m).at(-1):monthKeys(c.y,c.m)[0]);
  const target=wrap.querySelector(`[data-date=\"${targetKey}\"]`);
  if(!target)return;
  const sticky=wrap.querySelector('.habit-sticky');
  const stickyWidth=sticky?sticky.getBoundingClientRect().width:0;
  const visibleWidth=Math.max(0,wrap.clientWidth-stickyWidth);
  const desired=target.offsetLeft-stickyWidth-Math.max(0,(visibleWidth-target.offsetWidth)/2);
  const max=Math.max(0,wrap.scrollWidth-wrap.clientWidth);
  wrap.scrollLeft=Math.max(0,Math.min(desired,max));
}
function afterRender(){
  if(page==='schedule'&&!schedScrolled){schedScrolled=true;const e=document.getElementById('nowline');if(e)e.scrollIntoView({block:'center'});}
  if(page==='habits'&&!habitGridAutoPositioned){
    habitGridAutoPositioned=true;
    requestAnimationFrame(()=>requestAnimationFrame(positionHabitGrid));
  }
}
function conflictWith(it){for(let i=0;i<7;i++){const d=new Date(it.date+'T00:00:00');d.setDate(d.getDate()+i);const dk=localKey(d);if(!occurs(it,dk)||it.type==='break')continue;const a=slot(it,dk);for(const o of itemsFor(dk)){if(o.type==='break')continue;const b=slot(o,dk),ov=Math.min(a.e,b.e)-Math.max(a.s,b.s);if(ov>0)return{it:o,min:ov};}}return null;}
function durHint(){const a=document.getElementById('sStart').value,b=document.getElementById('sEnd').value,e=document.getElementById('sDur');e.textContent=a&&b&&toMin(b)>toMin(a)?'Duration: '+fmtDur(toMin(b)-toMin(a)):'End must be after start';}

  <div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitSched()">Add</button></div>`;

async function submitSched(){
  const v = id => document.getElementById(id).value;
  const title = v('sTitle').trim();

  if(!title) return;

  const start = v('sStart');
  const end = v('sEnd');

  if(!start || !end || toMin(end) <= toMin(start)){
    toast('End time must be after start time');
    return;
  }

  const link = v('sLink');
  const rep = v('sRep');

  const it = {
    id: uid(),
    title,
    type: v('sType'),
    date: v('sDate') || todayKey(),
    start,
    end,
    repeat: rep,
    days: [...document.querySelectorAll('#sDays input:checked')]
      .map(x => +x.value),
    priority: v('sPri'),
    notify: document.getElementById('sNotify').checked,
    remindBefore: +v('sBefore'),
    monitor: document.getElementById('sMon').checked,
    interval: +v('sInt'),
    maxRem: +v('sMax'),
    log: {},
    createdAt: new Date().toISOString()
  };

  if(rep === 'custom' && !it.days.length){
    toast('Pick at least one day');
    return;
  }

  if(link.startsWith('h:')){
    it.habitId = link.slice(2);
  }

  if(link.startsWith('t:')){
    it.taskId = link.slice(2);
  }

  const cf = conflictWith(it);

  if(
    cf &&
    !confirm(
      '⚠ Schedule conflict\n"' +
      title +
      '" overlaps "' +
      cf.it.title +
      '" by ' +
      cf.min +
      ' minutes.\n\n' +
      'OK = keep both · Cancel = go back and change the time'
    )
  ){
    return;
  }

  // Show immediately in the app
  state.schedules.push(it);

  if(it.repeat === 'once'){
    schedDate = it.date;
  }

  save();
  closeModal();
  render();

  // Save to Supabase
  const synced = await saveScheduleToCloud(it);

  if(synced){
    // Save again because Supabase gives the schedule its permanent ID
    save();

    console.log("✅ Schedule synced to Supabase");
  }else{
    console.error("❌ Schedule was not synced to Supabase");
  }
}

function enableScheduleAlarm(){
  state.settings.notificationsEnabled=true;
  state.settings.mode='alarm';
  if(state.settings.sound==='off')state.settings.sound='default';
  save();
  askPerm().then(()=>{ReminderManager.tick();render();});
}
function notifSettings(){
  const S=state.settings,p='Notification' in window?Notification.permission:'unsupported';
  const tg=(k,l)=>`<label class="chk"><input type="checkbox" ${S[k]?'checked':''} onchange="setS('${k}',this.checked)"> ${l}</label>`;
  const sel=(k,o)=>`<select onchange="setS('${k}',this.value)">${o.map(x=>`<option value="${x[0]}" ${S[k]===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
  return`<div class="card"><h2>Notifications &amp; reminders</h2>${tg('notificationsEnabled','Enable reminders')}
  <p class="meta" style="margin:-6px 0 12px">${p==='granted'?'Browser notifications are allowed.':p==='denied'?"Browser notifications are blocked — you'll still get in-app alerts while the app is open.":p==='unsupported'?"This browser doesn't support notifications — in-app alerts only.":'Browser permission not granted yet.'}</p>
  <div class="field"><label>Reminder style</label>${sel('mode',[['gentle','Gentle — one notification'],['normal','Normal — start + one follow-up'],['persistent','Persistent — repeat until done or max'],['alarm','Alarm — full-screen alert + sound']])}</div>
  <div class="field"><label>Alarm sound (only while app is open)</label>${sel('sound',[['off','Off'],['default','Default'],['soft','Soft'],['strong','Strong']])}</div>
  ${tg('taskRem','Task reminders')}${tg('habitRem','Schedule-linked habit reminders')}${tg('routineRem','Routine reminders')}${tg('overdueRem','Overdue follow-ups')}
  <label class="chk"><input type="checkbox" ${S.uncompletedHabitReminders?'checked':''} onchange="setS('uncompletedHabitReminders',this.checked)"> Random reminders for uncompleted habits</label>
  <div class="two"><div class="field"><label>Habit reminders per day</label><select onchange="setS('habitReminderMax',this.value)">${[3,4,5,6,8,10].map(x=>`<option value="${x}" ${Number(S.habitReminderMax)===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Reminder window</label><div class="two"><input type="time" value="${S.habitReminderStart}" onchange="setS('habitReminderStart',this.value)"><input type="time" value="${S.habitReminderEnd}" onchange="setS('habitReminderEnd',this.value)"></div></div></div>
  <p class="meta" style="margin:-4px 0 12px">When enabled, Habit Flow creates random reminder times on the server and sends Web Push notifications about habits that are still incomplete. Completed or skipped habits leave the reminder pool. Notifications can arrive even when the iPhone Home Screen app is closed.</p>
  <label class="chk"><input type="checkbox" ${S.quiet.enabled?'checked':''} onchange="setQ('enabled',this.checked)"> Quiet hours (P1 items still notify)</label>
  <div class="two"><div class="field"><label>From</label><input type="time" value="${S.quiet.start}" onchange="setQ('start',this.value)"></div><div class="field"><label>To</label><input type="time" value="${S.quiet.end}" onchange="setQ('end',this.value)"></div></div>
  <p class="meta"><b>Push reminders:</b> the daily random schedule is processed by Supabase every minute and delivered through Web Push. The app must be installed/added to the iPhone Home Screen and notifications must be allowed. The existing in-app timer remains only as a local fallback until server-side reminders are configured.</p></div>
  <div class="card"><h2>Developer · simulated time</h2><p class="meta" style="margin-bottom:10px">Clock now: ${fmtT(minutesSinceMidnight(now()))} ${S.simOffset?'(simulated — also shifts "today")':'(real)'}</p>
  <div class="two"><div class="field"><label>Jump to</label><input type="time" id="simT"></div><div class="field"><label>&nbsp;</label><button class="btn ghost" onclick="setSim()">Apply</button></div></div>
  <div class="sact"><button class="btn ghost sm" onclick="advSim(30)">+30 min</button><button class="btn ghost sm" onclick="advSim(60)">+1 h</button><button class="btn ghost sm" onclick="setS('simOffset',0)">Real time</button></div></div>`;
}
function schedStats(){
  if(!state.schedules.length)return'';
  const n=now();let pl=0,ok=0,late=0,sk=0,ms=0,sn=0,rs=0,ds=0;
  for(let i=0;i<7;i++){const dk=keyOffset(i-6);itemsFor(dk).forEach(it=>{
    if(!TRACKED.includes(it.type))return;const st=getScheduleStatus(it,dk,n),o=occR(it,dk);
    if(['upcoming','starting-soon','active','snoozed','overdue'].includes(st))return; // still actionable → not judged yet
    pl++;sn+=o.snoozes||0;rs+=o.reschedules||0;
    if(st==='completed'){if((o.delay||0)>5){late++;ds+=o.delay;}else ok++;}else if(st==='skipped')sk++;else ms++;
  });}
  const lg=state.reminderLogs,fw=lg.length?Math.round(lg.filter(l=>l.action==='complete').length/lg.length*100):null,r=(a,b)=>`<div class="item"><div class="itname">${a}</div><div class="meta">${b}</div></div>`;
  return`<div class="card"><h2>Schedule (last 7 days)</h2>${pl?r('Completion rate',Math.round((ok+late)/pl*100)+'% of '+pl)+r('On time',ok)+r('Delayed',late+(late?' · avg '+fmtDur(Math.round(ds/late)):''))+r('Skipped',sk)+r('Missed',ms)+r('Snoozes / reschedules',sn+' / '+rs)+r('Follow-through after reminder',fw===null?'—':fw+'%'):'<div class="meta">Finished scheduled items will show up here.</div>'}</div>`;
}
